# Build the APK on GitHub without installing Android Studio.
# Upload this folder to a GitHub repository, open the "Actions" tab, run "Build APK",
# then download "kwix-apk" from the finished run.
name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kwix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
